name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcode-select -p && swiftc --version

      - name: Unit tests and app build
        run: ./build.sh   # runs ./test.sh first and fails the build if any test fails

      - name: Package app
        run: ditto -c -k --keepParent build/NotchHider.app build/NotchHider.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NotchHider-${{ github.sha }}
          path: build/NotchHider.zip
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # gitleaks scans the full history
          persist-credentials: false

      - name: Install scanners (pinned versions)
        run: |
          sudo apt-get install -y -qq zsh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          pipx install zizmor==1.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; for zizmor's online audits
        run: ./scan.sh
