name: Release

# Push a tag like v1.2.0 (matching CFBundleShortVersionString in Info.plist) to publish a release.
# The tagged commit must already be on main, so a release can only ship reviewed, CI-tested code.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # full history, for the main-ancestry check
          persist-credentials: false  # no token left in .git/config while tests and build run

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Tag must match app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $version"
            exit 1
          fi

      - name: Test, build, zip and generate cask
        run: ./release.sh   # runs the tests first

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            build/NotchHider-*.zip
            build/notchhider.rb
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the release; only this job, which runs no repo code, gets it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Notch Hider $GITHUB_REF_NAME" --generate-notes
